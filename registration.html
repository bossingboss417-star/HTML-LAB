<h1>Student Registration Form</h1>

<form action="#" method="post">
<p>
<label for="fullname">Full Name:</label><br>
<input type="text" id="fullname" name="fullname" placeholder="Enter your full name" minlength="3" maxlength="50" required>
</p>

<p>
<label for="studentid">Student ID:</label><br>
<input type="text" id="studentid" name="studentid" placeholder="e.g. 26-1234-567" minlength="5" maxlength="15" required>
</p>

<p>
<label for="email">Email:</label><br>
<input type="email" id="email" name="email" placeholder="student@uc-bcf.edu.ph" required>
</p>

<p>
<label for="password">Password:</label><br>
<input type="password" id="password" name="password" placeholder="Minimum 8 characters" minlength="8" maxlength="20" required>
</p>

<p>
<label for="birthday">Birthday:</label><br>
<input type="date" id="birthday" name="birthday" required>
</p>

<p>
<label>Gender:</label><br>
<input type="radio" id="male" name="gender" value="Male" required>
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>
<input type="radio" id="other" name="gender" value="Other">
<label for="other">Other</label>
</p>

<p>
<label for="program">Program:</label><br>
<select id="program" name="program" required>
<option value="">-- Select Program --</option>
<option value="BSIT-Web">BSIT - Web Technology Track</option>
<option value="BSIT-NetSec">BSIT - Network and Security Track</option>
<option value="BSCS">BS Computer Science</option>
<option value="BSDA">BS Data Analytics</option>
</select>
</p>

<p>
<label>Hobbies:</label><br>
<input type="checkbox" id="coding" name="hobbies" value="Coding">
<label for="coding">Web Programming</label><br>
<input type="checkbox" id="gaming" name="hobbies" value="Gaming">
<label for="gaming">Online Gaming</label><br>
<input type="checkbox" id="music" name="hobbies" value="Music">
<label for="music">Listening to Music</label>
</p>

<p>
<label for="address">Address:</label><br>
<textarea id="address" name="address" rows="3" cols="40" placeholder="Enter your complete address in Baguio City" required></textarea>
</p>

<p>
<label for="comments">Comments:</label><br>
<textarea id="comments" name="comments" rows="4" cols="40" placeholder="Additional notes or comments" maxlength="250"></textarea>
</p>

<p>
<input type="submit" value="Submit Registration">
<input type="reset" value="Reset Form">
<button type="button">Verify Info</button>
</p>
</form>
</body>
</html>
